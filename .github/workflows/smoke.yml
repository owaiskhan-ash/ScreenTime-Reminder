name: Runner smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Print environment
        run: |
          echo "runner ok"
          uname -a
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5
          git --version
