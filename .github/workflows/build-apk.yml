name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::Gradle build failed (exit $status)"
            grep -E "^e: |error:|Unresolved reference|FAILURE:|What went wrong|Caused by:" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -30 build.log
            exit $status
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenTimeReminder.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeReminder-apk
          path: ScreenTimeReminder.apk
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Screen Time Reminder — latest build
          body: |
            The latest installable build of **Screen Time Reminder** by Just Simple Apps.

            - Live screen time read from the phone's own usage record
            - Calm break reminders during long sessions
            - Daily limit, weekly history, top apps
            - Free. No ads. No tracking. No account.

            **Install:** download the APK, open it, and allow installs from this source if Android asks.
          files: ScreenTimeReminder.apk
          make_latest: true
