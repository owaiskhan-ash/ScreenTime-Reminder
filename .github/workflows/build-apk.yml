name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional versioned release tag (for example v1.2.2)'
        required: false
        type: string
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
      - 'apk-latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew testDebugUnitTest --no-daemon > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            echo "::error::Unit tests failed (exit $status)"
            grep -E "FAILED|Test.*>.*FAILED|e: |error:" test.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            echo "::error::Gradle build failed (exit $status)"
            grep -E "e: |error:|Unresolved reference|FAILURE|What went wrong|Caused by:" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            tail -c 50000 build.log > failure.txt
          else
            echo "no build.log produced" > failure.txt
          fi
          python3 - <<'EOF'
          import json, os, subprocess
          body = open('failure.txt', encoding='utf-8', errors='replace').read()
          body = "Automated build failure report\n\n```\n" + body + "\n```"
          payload = json.dumps({"body": body[:60000]})
          open('payload.json', 'w').write(payload)
          subprocess.run([
              'gh', 'api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              '--input', 'payload.json'
          ], check=False)
          EOF


      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenTimeReminder.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeReminder-apk
          path: ScreenTimeReminder.apk
          if-no-files-found: error

      - name: Publish rolling release (apk-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Screen Time Reminder — latest build
          body: |
            The latest installable build of **Screen Time Reminder** by Just Simple Apps.

            - Live screen time read from the phone's own usage record
            - Calm break reminders during long sessions
            - Daily limit, weekly history, top apps
            - Free. No ads. No tracking. No account.

            **Install:** download the APK, open it, and allow installs from this source if Android asks.
          files: |
            ScreenTimeReminder.apk
            docs/icon.png
          make_latest: true

      - name: Publish versioned release (tag or manual)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')) || (github.ref == 'refs/heads/arena/426b1b67-screentime-reminder' && contains(github.event.head_commit.message, '[release v1.2.2]'))
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenTimeReminder.apk
            docs/icon.png
            docs/st-logo-transparent.png
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.2.2' }}
          target_commitish: ${{ github.sha }}
          name: Screen Time Reminder ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.2.2' }} — Material Texture Fix
          body: |
            Replaced procedural dot/line grain with embedded leather, felt and suede
            texture samples from the approved ST artwork. Density-consistent texture
            scale, recessed stitching and restrained directional lighting.
            ST header, launcher and splash logo retained. Tracking logic unchanged.

            Download ScreenTimeReminder.apk below (Android 8.0+).
            This is a debug-signed APK, as in previous builds, not a Play Store production release.
            If an older APK has a different signing key, Android requires uninstalling it first;
            uninstalling clears local settings/history.

            Unit tests and APK assembly passed in this workflow. Native device visual verification not performed.
          generate_release_notes: true
          make_latest: true
